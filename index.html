<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TÁC ĐỘNG CỦA MÔ HÌNH TRẢI NGHIỆM NGHỀ TÍCH HỢP CÔNG NGHỆ SỐ CÙNG NGHỆ NHÂN LÀM TRANH ĐÁ QUÝ ĐẾN NĂNG LỰC ĐỊNH HƯỚNG NGHỀ NGHIỆP CỦA HỌC VIÊN GIÁO DỤC THƯỜNG XUYÊN KHU VỰC LỤC YÊN</title>
    <!-- Tailwind CSS -->
    <script src="assets/tailwind.js"></script>
    <!-- Google Fonts for Roboto / Google Sans style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0ebf8;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }
        .font-google {
            font-family: 'Google Sans', 'Roboto', sans-serif;
        }
        /* Hide scrollbars for filter bar while preserving scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Mobile smooth horizontal scroll */
        .chart-scroll-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .chart-scroll-wrap::-webkit-scrollbar {
            height: 6px;
        }
        .chart-scroll-wrap::-webkit-scrollbar-track {
            background: #f1f3f4;
            border-radius: 3px;
        }
        .chart-scroll-wrap::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen pb-16 antialiased">

    <!-- GOOGLE FORMS AUTHENTIC HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        
        <!-- ROW 1: Branding & Form Title -->
        <div class="border-b border-slate-100">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <!-- Google Forms Purple Icon -->
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-[#673ab7] flex items-center justify-center text-white shadow-xs flex-shrink-0">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                    </div>
                    
                    <!-- Titles -->
                    <div class="overflow-hidden">
                        <div class="flex items-center space-x-2">
                            <h1 id="survey-main-title" class="font-google font-bold text-slate-900 text-sm sm:text-base tracking-tight truncate">
                                PHIẾU KHẢO SÁT 02 (SAU THỰC NGHIỆM)
                            </h1>
                            <span class="hidden sm:inline-block text-[10px] px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 font-semibold whitespace-nowrap">
                                Google Forms View
                            </span>
                        </div>
                        <p class="text-[11px] sm:text-xs text-slate-500 truncate mt-0.5" title="Dự án: TÁC ĐỘNG CỦA MÔ HÌNH TRẢI NGHIỆM NGHỀ TÍCH HỢP CÔNG NGHỆ SỐ CÙNG NGHỆ NHÂN LÀM TRANH ĐÁ QUÝ ĐẾN NĂNG LỰC ĐỊNH HƯỚNG NGHỀ NGHIỆP CỦA HỌC VIÊN GIÁO DỤC THƯỜNG XUYÊN KHU VỰC LỤC YÊN">
                            Dự án: TÁC ĐỘNG CỦA MÔ HÌNH TRẢI NGHIỆM NGHỀ TÍCH HỢP CÔNG NGHỆ SỐ CÙNG NGHỆ NHÂN LÀM TRANH ĐÁ QUÝ...
                        </p>
                    </div>
                </div>

                <!-- Right Action Buttons -->
                <div class="flex items-center space-x-2 flex-shrink-0 ml-3">
                    <span class="text-xs text-slate-500 hidden md:inline">Đã lưu tự động</span>
                    <div class="w-8 h-8 rounded-full bg-purple-700 text-white flex items-center justify-center text-xs font-bold font-google">
                        GV
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 2: Authentic Google Forms Centered Tabs (Câu hỏi | Câu trả lời | Cài đặt) -->
        <div class="bg-white border-b border-slate-200">
            <div class="max-w-5xl mx-auto px-4 sm:px-6">
                <div class="flex items-center justify-center space-x-8 sm:space-x-12 font-google text-xs sm:text-sm">
                    <!-- Tab: Câu hỏi -->
                    <button class="py-3 px-1 text-slate-500 hover:text-slate-800 transition whitespace-nowrap">
                        Câu hỏi
                    </button>

                    <!-- Tab: Câu trả lời (Active with Purple Underline & Badge) -->
                    <button class="py-3 px-1 border-b-2 border-[#673ab7] text-[#673ab7] font-bold flex items-center space-x-2 whitespace-nowrap">
                        <span>Câu trả lời</span>
                        <span id="response-count-badge" class="bg-[#673ab7] text-white text-[11px] px-2 py-0.5 rounded-full font-mono font-bold leading-none">
                            472
                        </span>
                    </button>

                    <!-- Tab: Cài đặt -->
                    <button class="py-3 px-1 text-slate-500 hover:text-slate-800 transition whitespace-nowrap">
                        Cài đặt
                    </button>
                </div>
            </div>
        </div>

        <!-- ROW 3: Filter & Segment Toolbar -->
        <div class="bg-slate-50 py-2.5 px-3 sm:px-6">
            <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2.5">
                <!-- Survey Switcher (Pre vs Post) -->
                <div class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar">
                    <span class="text-xs font-bold text-slate-600 hidden sm:inline">Khảo sát:</span>
                    <div class="inline-flex bg-white border border-slate-300 rounded-lg p-0.5 shadow-xs">
                        <button class="survey-tab-btn px-3 py-1 text-xs font-semibold rounded-md transition text-slate-600 hover:text-purple-700 whitespace-nowrap" data-survey="pre">
                            Phiếu 01 (Trước TN)
                        </button>
                        <button class="survey-tab-btn px-3 py-1 text-xs font-bold rounded-md transition bg-purple-50 text-purple-700 border-b-2 border-purple-700 whitespace-nowrap" data-survey="post">
                            Phiếu 02 (Sau TN)
                        </button>
                    </div>
                </div>

                <!-- Group Filter Controls (Tất cả / Thực nghiệm / So sánh) -->
                <div class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar">
                    <span class="text-xs font-bold text-slate-600 hidden sm:inline">Nhóm:</span>
                    <div class="inline-flex bg-white border border-slate-300 rounded-lg p-0.5 shadow-xs">
                        <button class="group-filter-btn px-3 py-1 text-xs font-bold rounded-md transition bg-purple-700 text-white shadow-xs whitespace-nowrap" data-group="all">
                            Tất cả
                        </button>
                        <button class="group-filter-btn px-3 py-1 text-xs font-semibold rounded-md transition bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap" data-group="Thực nghiệm">
                            Thực nghiệm
                        </button>
                        <button class="group-filter-btn px-3 py-1 text-xs font-semibold rounded-md transition bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap" data-group="So sánh">
                            So sánh
                        </button>
                    </div>
                </div>

                <!-- Secondary Filter: Class & Gender -->
                <div class="flex items-center space-x-2">
                    <select id="filter-class" class="text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:border-purple-600 shadow-xs">
                        <option value="all">Tất cả các lớp</option>
                        <!-- Injected dynamically -->
                    </select>

                    <select id="filter-gender" class="text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:border-purple-600 shadow-xs">
                        <option value="all">Tất cả giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN FORM RESPONSES CONTENT -->
    <main class="max-w-5xl mx-auto px-3 sm:px-6 pt-5 sm:pt-6">
        
        <!-- DYNAMIC SECTIONS CONTAINER -->
        <div id="form-sections-container">
            <!-- Injected by form_app.js -->
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="assets/chart.umd.js"></script>
    <script>
        if (typeof Chart === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>');
        }
    </script>
    <script src="form_data.js"></script>
    <script src="form_app.js"></script>
</body>
</html>
