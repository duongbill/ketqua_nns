<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TÁC ĐỘNG CỦA MÔ HÌNH TRẢI NGHIỆM NGHỀ TÍCH HỢP CÔNG NGHỆ SỐ CÙNG NGHỆ NHÂN LÀM TRANH ĐÁ QUÝ ĐẾN NĂNG LỰC ĐỊNH HƯỚNG NGHỀ NGHIỆP CỦA HỌC VIÊN GIÁO DỤC THƯỜNG XUYÊN KHU VỰC LỤC YÊN</title>
    <!-- Tailwind CSS -->
    <script src="assets/tailwind.js"></script>
    <!-- Google Fonts for Roboto / Google Sans style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0ebf8;
            color: #202124;
        }
        .font-google {
            font-family: 'Google Sans', 'Roboto', sans-serif;
        }
        /* Google Forms Purple Theme */
        .bg-gf-purple {
            background-color: #673ab7;
        }
        .text-gf-purple {
            color: #673ab7;
        }
        .border-gf-purple {
            border-color: #673ab7;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f3f4;
        }
        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #673ab7;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- GOOGLE FORMS TOP NAVBAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between py-2.5">
                <div class="flex items-center space-x-3">
                    <!-- Google Forms Purple Icon -->
                    <div class="w-10 h-10 rounded-lg bg-[#673ab7] flex items-center justify-center text-white shadow-xs">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h1 id="survey-main-title" class="font-google font-bold text-slate-800 text-sm sm:text-base tracking-tight">
                                PHIẾU KHẢO SÁT 02 (SAU THỰC NGHIỆM)
                            </h1>
                            <span class="text-[11px] px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 font-semibold">
                                Google Forms View
                            </span>
                        </div>
                        <p class="text-[11px] text-slate-600 font-medium">Dự án: TÁC ĐỘNG CỦA MÔ HÌNH TRẢI NGHIỆM NGHỀ TÍCH HỢP CÔNG NGHỆ SỐ CÙNG NGHỆ NHÂN LÀM TRANH ĐÁ QUÝ ĐẾN NĂNG LỰC ĐỊNH HƯỚNG NGHỀ NGHIỆP CỦA HỌC VIÊN GIÁO DỤC THƯỜNG XUYÊN KHU VỰC LỤC YÊN</p>
                    </div>
                </div>

                <!-- Google Forms 3 Tabs (Centered View) -->
                <div class="hidden md:flex items-center space-x-8 font-google text-sm">
                    <button class="py-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">
                        Câu hỏi
                    </button>
                    <button class="py-3.5 border-b-2 border-[#673ab7] text-[#673ab7] font-bold flex items-center space-x-2">
                        <span>Câu trả lời</span>
                        <span id="response-count-badge" class="bg-[#673ab7] text-white text-xs px-2 py-0.5 rounded-full font-bold">
                            472
                        </span>
                    </button>
                    <button class="py-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">
                        Cài đặt
                    </button>
                </div>
            </div>
        </div>

        <!-- FILTER & SELECTION TOOLBAR -->
        <div class="bg-slate-50 border-t border-slate-200 py-2.5 px-4 sm:px-6">
            <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <!-- Survey Switcher (Pre vs Post) -->
                <div class="flex items-center bg-white border border-slate-300 rounded-lg p-1 shadow-xs">
                    <button class="survey-tab-btn px-3 py-1 text-xs font-semibold rounded-md transition text-slate-600 hover:text-purple-700" data-survey="pre">
                        Phiếu 01 (Trước TN)
                    </button>
                    <button class="survey-tab-btn px-3 py-1 text-xs font-bold rounded-md transition bg-purple-50 text-purple-700 border-b-2 border-purple-700" data-survey="post">
                        Phiếu 02 (Sau TN)
                    </button>
                </div>

                <!-- Group Filter Controls (Tất cả / Thực nghiệm / So sánh) -->
                <div class="flex items-center space-x-1 bg-white border border-slate-300 rounded-lg p-1 shadow-xs">
                    <span class="text-xs font-bold text-slate-600 px-2">Nhóm:</span>
                    <button class="group-filter-btn px-3 py-1 text-xs font-bold rounded-md transition bg-purple-700 text-white shadow-xs" data-group="all">
                        Tất cả
                    </button>
                    <button class="group-filter-btn px-3 py-1 text-xs font-semibold rounded-md transition bg-slate-100 text-slate-700 hover:bg-slate-200" data-group="Thực nghiệm">
                        Thực nghiệm
                    </button>
                    <button class="group-filter-btn px-3 py-1 text-xs font-semibold rounded-md transition bg-slate-100 text-slate-700 hover:bg-slate-200" data-group="So sánh">
                        So sánh
                    </button>
                </div>

                <!-- Secondary Filter: Class & Gender -->
                <div class="flex items-center space-x-2">
                    <select id="filter-class" class="text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:border-purple-600 shadow-xs">
                        <option value="all">Tất cả các lớp</option>
                        <!-- Injected dynamically -->
                    </select>

                    <select id="filter-gender" class="text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:border-purple-600 shadow-xs">
                        <option value="all">Tất cả giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN FORM RESPONSES CONTENT -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-6">
        
        <!-- DYNAMIC SECTIONS CONTAINER -->
        <div id="form-sections-container">
            <!-- Injected by form_app.js -->
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="assets/chart.umd.js"></script>
    <script>
        if (typeof Chart === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>');
        }
    </script>
    <script src="form_data.js"></script>
    <script src="form_app.js"></script>
</body>
</html>
